  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.s), iterations: 600000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.i) }, key, b64(P.c));
  sessionStorage.setItem(KEY, pw);
  document.open(); document.write(new TextDecoder().decode(pt)); document.close();
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = 'Unlocking…';
  try { await unlock(document.getElementById('pw').value); }
  catch (_) { document.getElementById('err').textContent = 'Incorrect password.'; btn.disabled = false; btn.textContent = 'View'; }
});
const saved = sessionStorage.getItem(KEY);
if (saved) unlock(saved).catch(() => sessionStorage.removeItem(KEY));
</script>
